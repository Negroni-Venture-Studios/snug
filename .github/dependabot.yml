# Weekly dependency updates, one grouped pull request per ecosystem, so the
# lockfile is rebased once rather than once per package under branch protection.
# Each ecosystem waits 14 days after a release before proposing it: the
# two-week rule in AGENTS.md. Security updates are not delayed by this.
version: 2
updates:
  # The uv ecosystem updates pyproject.toml and uv.lock together, which keeps
  # the `uv lock --check` step in CI green.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]

  # GitHub Actions, which CI pins to commit SHAs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels: ["ci"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  # The Dockerfiles' base images, pinned by digest: Snug's own, and the
  # LibreOffice converter's, which shares its Python base.
  - package-ecosystem: "docker"
    directories: ["/", "/converter"]
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "image"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    # Python patch releases only. Moving the image to a new minor version
    # (3.15) is a deliberate change, made after CI tests that version.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
