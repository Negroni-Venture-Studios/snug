name: Image

# Pull requests build the image and smoke-test it, pushing nothing.
# A merge to main publishes :edge; a version tag (v1.0.0) publishes :1.0.0
# and :latest (decided 5 November 2026), and a release candidate (v1.0.0-rc.1)
# only :1.0.0-rc.1. Each image records its version and commit. amd64 and arm64.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/negroni-venture-studios/snug

jobs:
  smoke:
    name: image smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build for amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: snug:smoke
      - name: Start it and wait for /healthz
        run: |
          docker run --detach --name snug -p 8000:8000 \
            -e SNUG_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')" \
            -e SNUG_DOMAIN=localhost -e SNUG_HTTPS=false snug:smoke
          for _ in $(seq 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then echo; exit 0; fi
            sleep 2
          done
          docker logs snug
          exit 1
      - name: Runs as the unprivileged snug user, and the worker renders a PDF
        run: |
          test "$(docker exec snug id -un)" = "snug"
          docker exec snug python -c "
          import io, tempfile, pypdfium2
          from snug.rendering import sandbox
          pdf = pypdfium2.PdfDocument.new(); pdf.new_page(200, 100)
          out = io.BytesIO(); pdf.save(out)
          with tempfile.NamedTemporaryFile(suffix='.pdf') as f:
              f.write(out.getvalue()); f.flush()
              assert sandbox.inspect(f.name)['pages'] == 1
              assert sandbox.render(f.name, 1, 800)[:4] == b'RIFF'
          print('rendered in the worker')
          "
      - name: Ships Snug's own code compiled, so a worker does not compile it on every page
        run: |
          docker exec snug sh -c 'ls /app/snug/rendering/__pycache__/worker.*.pyc'
      - name: Ships the third-party licence notices
        run: |
          docker exec snug test -f /app/THIRD_PARTY_LICENCES.md
          docker exec snug sh -c 'ls -d /app/.venv/lib/python3*/site-packages/pypdfium2*.dist-info/licenses/LICENSES'
      - name: Stop
        if: always()
        run: docker rm --force snug || true
      - name: Start the Compose deployment behind Caddy
        working-directory: deploy
        env:
          SNUG_IMAGE: snug:smoke
          RCLONE: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
        run: |
          printf 'SNUG_SECRET_KEY=%s\nSNUG_DOMAIN=localhost\n' \
            "$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')" > snug.env
          ln -s snug.env .env
          # Back up to a folder standing in for the bucket, every 10 seconds.
          mkdir -m 777 bucket backup
          password=$(docker run --rm "$RCLONE" obscure "$(openssl rand -base64 32)")
          salt=$(docker run --rm "$RCLONE" obscure "$(openssl rand -base64 32)")
          printf '[bucket]\ntype = local\n\n[snug-backup]\ntype = crypt\nremote = bucket:/bucket/snug\npassword = %s\npassword2 = %s\n' \
            "$password" "$salt" > backup/rclone.conf
          chmod 644 backup/rclone.conf
          printf 'services:\n  backup:\n    environment:\n      SNUG_BACKUP_EVERY: "10"\n    volumes:\n      - ./bucket:/bucket\n' \
            > compose.override.yaml
          docker compose up --detach --wait --wait-timeout 120
      - name: Caddy serves HTTPS and redirects HTTP
        run: |
          curl --fail --silent --insecure https://localhost/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' \
            http://localhost/admin/login)" = "308 https://localhost/admin/login"
          curl --fail --silent --insecure --output /dev/null https://localhost/admin/login
      - name: A forged X-Forwarded-For is not believed
        working-directory: deploy
        run: |
          jar=$(mktemp)
          token=$(curl --silent --insecure --cookie-jar "$jar" https://localhost/admin/login \
            | grep -o 'name="csrfmiddlewaretoken" value="[^"]*"' | sed 's/.*value="//; s/"$//')
          curl --silent --insecure --cookie "$jar" --output /dev/null \
            --header 'X-Forwarded-For: 192.0.2.66' --header 'Origin: https://localhost' \
            --header 'Referer: https://localhost/admin/login' \
            --data-urlencode "csrfmiddlewaretoken=$token" \
            --data-urlencode 'email=nobody@example.com' \
            --data-urlencode 'password=not-the-password' https://localhost/admin/login
          seen=$(docker compose exec -T snug snug shell --command \
            "from snug.audit.models import AuditEvent as A; print(A.objects.get(action='admin.login_failed').ip_address)" \
            | tail -n 1)
          echo "recorded: $seen"
          test "$seen" != "192.0.2.66"
          test "$seen" != "172.30.83.2"
      - name: The worker still renders in the hardened container
        working-directory: deploy
        run: |
          docker compose exec -T snug python -c "
          import io, tempfile, pypdfium2
          from snug.rendering import sandbox
          pdf = pypdfium2.PdfDocument.new(); pdf.new_page(200, 100)
          out = io.BytesIO(); pdf.save(out)
          with tempfile.NamedTemporaryFile(suffix='.pdf') as f:
              f.write(out.getvalue()); f.flush()
              assert sandbox.render(f.name, 1, 800)[:4] == b'RIFF'
          print('rendered in the worker')
          "
          docker compose exec -T snug snug housekeeping
      - name: The database and uploads reach the bucket, encrypted
        working-directory: deploy
        run: |
          docker compose exec -T snug sh -c \
            'mkdir -p -m 700 /var/lib/snug/originals && echo plain-text-marker > /var/lib/snug/originals/deck.pdf'
          for _ in $(seq 30); do
            listing=$(docker compose exec -T backup rclone lsf -R snug-backup: || true)
            if echo "$listing" | grep -q '^originals/deck.pdf$' \
              && echo "$listing" | grep -q '^database/ltx/'; then break; fi
            sleep 2
          done
          echo "$listing"
          echo "$listing" | grep -q '^originals/deck.pdf$'
          echo "$listing" | grep -q '^database/ltx/'
          docker compose exec -T snug test -s /var/lib/snug/backup/last-success
          docker compose exec -T snug test ! -e /var/lib/snug/backup/problem
          ! grep -r --quiet plain-text-marker bucket
          ! find bucket -name 'deck.pdf' | grep --quiet .
      - name: A deleted upload is kept under deleted/ in the bucket
        working-directory: deploy
        run: |
          docker compose exec -T snug rm /var/lib/snug/originals/deck.pdf
          kept="deleted/$(date -u +%Y-%m-%d)/originals/deck.pdf"
          for _ in $(seq 30); do
            if docker compose exec -T backup rclone lsf -R snug-backup: | grep -qx "$kept"; then exit 0; fi
            sleep 2
          done
          docker compose exec -T backup rclone lsf -R snug-backup:
          exit 1
      - name: snug doctor finds everything working
        working-directory: deploy
        run: |
          report=$(docker compose exec -T snug snug doctor)
          echo "$report"
          echo "$report" | grep -q '^ok        Housekeeping'
          echo "$report" | grep -q '^ok        Backups'
          # Columns are padded to the longest label, so any run of spaces separates them.
          echo "$report" | grep -Eq '^ok +Document worker +Documents are read in a confined worker \(landlock v'
          echo "$report" | grep -q '^skipped   HTTPS'
          echo "$report" | grep -Eq '^skipped +Office converter +Not installed'
          # On localhost without SMTP, emails go to the outbox folder.
          echo "$report" | grep -q '^ok        Email'
          echo "$report" | grep -q '^Everything is working.$'
      - name: A wiped server will not back up over the bucket, and snug restore brings it back
        working-directory: deploy
        env:
          SNUG_IMAGE: snug:smoke
        run: |
          docker compose exec -T snug snug shell --command \
            "from snug.core.models import SiteSettings as S; s = S.load(); s.company_name = 'Restore Check Ltd'; s.save()"
          docker compose exec -T snug sh -c 'echo the-deck > /var/lib/snug/originals/kept.pdf'
          sleep 25  # Litestream, then a backup cycle
          docker compose exec -T snug test ! -e /var/lib/snug/backup/problem

          docker compose down --volumes
          docker compose up --detach --wait --wait-timeout 120
          sleep 15
          docker compose exec -T snug cat /var/lib/snug/backup/problem | grep -q "another Snug's backups"

          echo replace | sh restore.sh
          seen=$(docker compose exec -T snug snug shell --command \
            "from snug.core.models import SiteSettings as S; print(S.load().company_name)" | tail -n 1)
          test "$seen" = "Restore Check Ltd"
          test "$(docker compose exec -T snug cat /var/lib/snug/originals/kept.pdf)" = "the-deck"
          sleep 15
          docker compose exec -T snug test ! -e /var/lib/snug/backup/problem
      - name: snug restore works on a server where Snug never started
        working-directory: deploy
        env:
          SNUG_IMAGE: snug:smoke
        run: |
          docker compose down --volumes
          sh restore.sh < /dev/null
          seen=$(docker compose exec -T snug snug shell --command \
            "from snug.core.models import SiteSettings as S; print(S.load().company_name)" | tail -n 1)
          test "$seen" = "Restore Check Ltd"
      - name: snug setup on a wiped server finds the backups and restores them
        working-directory: deploy
        env:
          SNUG_IMAGE: snug:smoke
        run: |
          docker compose down --volumes
          # As a founder runs it: as root, which it needs to hand rclone.conf
          # to the backup container's user.
          printf 'localhost\n\n\n' | sudo --preserve-env=SNUG_IMAGE sh setup.sh
          seen=$(sudo docker compose exec -T snug snug shell --command \
            "from snug.core.models import SiteSettings as S; print(S.load().company_name)" | tail -n 1)
          test "$seen" = "Restore Check Ltd"
      - name: Stop the Compose deployment
        if: always()
        working-directory: deploy
        run: |
          sudo docker compose logs || true
          sudo docker compose down --volumes || true

  office:
    # The LibreOffice converter (docs/office.md): built, run under gVisor with
    # the hardening deploy/compose.yaml gives it, one file per container, and
    # its PDFs read by Snug's own confined worker.
    name: office converter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build the converter for amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: converter/Dockerfile
          load: true
          tags: snug-office:smoke
      - name: Install gVisor's runsc
        # Pinned to the newest release at least two weeks old (AGENTS.md).
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases 20261026 main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update -qq
          sudo apt-get install --yes -qq runsc poppler-utils
          sudo runsc install
          sudo systemctl restart docker
          runsc --version
      - name: The seccomp filter applies inside gVisor
        run: |
          docker run --rm --runtime=runsc --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --entrypoint python3 snug-office:smoke -I -c "
          import socket
          from snug.office import supervisor
          supervisor.confine_child()
          socket.socket(socket.AF_UNIX).close()
          try:
              socket.socket(socket.AF_INET)
          except PermissionError:
              print('network sockets refused, Unix sockets allowed')
          else:
              raise SystemExit('a network socket was allowed')
          "
      - name: Make a Word document, a presentation and a workbook
        run: |
          mkdir -p samples
          python3 -c "
          from tests.office_files import make_docx, make_pptx, make_xlsx
          open('samples/sample.docx', 'wb').write(make_docx())
          open('samples/sample.pptx', 'wb').write(make_pptx(12))
          open('samples/sample.xlsx', 'wb').write(make_xlsx((('Summary', 'visible'), ('Detail', 'visible'))))
          # A field that would pull in a file on the converter's own disk, if links were updated.
          field = (
              '<w:p><w:r><w:fldChar w:fldCharType=\"begin\"/></w:r>'
              '<w:r><w:instrText xml:space=\"preserve\"> INCLUDETEXT \"/etc/snug-office.json\" </w:instrText></w:r>'
              '<w:r><w:fldChar w:fldCharType=\"separate\"/></w:r><w:r><w:t>placeholder</w:t></w:r>'
              '<w:r><w:fldChar w:fldCharType=\"end\"/></w:r></w:p>'
          )
          open('samples/sample.linked', 'wb').write(make_docx(body=field))
          "
      - name: Convert each in a fresh gVisor container
        run: |
          mkdir -p exchange/inbox exchange/outbox
          chmod 0755 exchange/inbox
          chmod 1733 exchange/outbox
          for sample in docx pptx xlsx linked; do
            kind=$sample
            if [ "$sample" = linked ]; then kind=docx; fi
            token="smoke${sample}000000000000"
            mkdir "exchange/inbox/$token"
            cp "samples/sample.$sample" "exchange/inbox/$token/input.$kind"
            printf '{"kind": "%s"}' "$kind" > "exchange/inbox/$token/job.json"
            began=$(date +%s)
            docker run --detach --name "office-$sample" --runtime=runsc --network=none --read-only \
              --tmpfs /tmp:size=768m,mode=1777 --cap-drop=ALL --security-opt=no-new-privileges \
              --memory=1g --memory-swap=1g --pids-limit=256 --cpus=1 \
              -v "$PWD/exchange/inbox:/exchange/inbox:ro" -v "$PWD/exchange/outbox:/exchange/outbox" \
              snug-office:smoke
            while [ "$(docker inspect -f '{{.State.Running}}' "office-$sample")" = true ]; do
              used=$(docker stats --no-stream --format '{{.MemUsage}}' "office-$sample" | cut -d/ -f1)
              echo "$sample: $used"
              sleep 1
            done
            echo "$sample: container lived $(( $(date +%s) - began )) s, exit $(docker inspect -f '{{.State.ExitCode}}' "office-$sample")"
            docker logs "office-$sample"
            docker rm "office-$sample" > /dev/null
            if [ -f "exchange/outbox/$token.error" ]; then cat "exchange/outbox/$token.error"; exit 1; fi
            head -c 5 "exchange/outbox/$token.pdf" | grep -q '%PDF-'
            pdfinfo "exchange/outbox/$token.pdf" | grep -E '^(Pages|Page size)'
          done
          cat exchange/outbox/status.json
          python3 -c "
          import json
          status = json.load(open('exchange/outbox/status.json'))
          assert status['libreoffice'] and status['built'], status
          assert status['seccomp'] == 'unix sockets only', status
          print('LibreOffice', status['libreoffice'], 'built', status['built'], 'kernel', status['kernel'])
          "
          test "$(pdfinfo exchange/outbox/smokepptx000000000000.pdf | awk '/^Pages/ {print $2}')" = 12
          # Links are never updated: the field shows its placeholder, not the file.
          pdftotext exchange/outbox/smokelinked000000000000.pdf - | tee linked.txt
          grep -q placeholder linked.txt
          if grep -q libreoffice linked.txt; then echo "the linked file was pulled into the PDF"; exit 1; fi
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Snug's confined worker reads each PDF
        run: |
          uv sync --locked --quiet
          uv run python -c "
          import glob
          from snug.rendering import sandbox
          for path in sorted(glob.glob('exchange/outbox/*.pdf')):
              facts = sandbox.inspect(path)
              print(path, facts['pages'], 'pages')
          "
      - name: Keep the PDFs to look at
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: office-converter-pdfs
          path: exchange/outbox/*.pdf
          retention-days: 7

  publish:
    name: publish image
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SNUG_BUILD_VERSION=${{ steps.meta.outputs.version }}
            SNUG_BUILD_COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
