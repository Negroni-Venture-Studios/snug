name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job runs with read-only access unless it says otherwise.
permissions:
  contents: read

# A newer push to a pull request cancels the older run. Runs on main are
# never cancelled, so every commit on main keeps a completed run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job names are spelled out because branch protection requires them by name.
# Third-party actions are pinned to commit SHAs; Dependabot keeps them current.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install
        run: uv sync --locked
      - name: Ruff lint, including security rules
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Hygiene hooks on every file
        run: |
          for hook in trailing-whitespace end-of-file-fixer check-yaml check-toml check-json check-merge-conflict debug-statements detect-private-key; do
            uv run pre-commit run --all-files --show-diff-on-failure "$hook"
          done
      - name: Dependency licences are compatible with MIT
        run: uv run python scripts/check_licences.py

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: mypy (strict)
        run: uv run mypy

  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Tests, with the coverage floor in pyproject.toml
        run: uv run pytest --cov --cov-report=term

  e2e:
    name: e2e (real browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Install Chromium for Playwright, the version pinned by uv.lock
        run: uv run playwright install --with-deps chromium
      - name: The investor's journey in a real browser (tests/e2e)
        env:
          SNUG_E2E: "1"
        run: uv run pytest tests/e2e --ds=tests.e2e_settings -p no:cacheprovider

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action needs a paid licence for organisation repositories, so
      # we run the gitleaks binary (MIT) directly, pinned and checksummed.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the full history for secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Audit installed packages for known vulnerabilities
        run: uv run pip-audit --skip-editable

  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: CycloneDX software bill of materials
        run: uvx --from "cyclonedx-bom==7.5.0" cyclonedx-py environment .venv --of JSON -o sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
