[project]
name = "snug"
version = "1.1.3"
description = "A self-hosted data room for early-stage founders."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Negroni Venture Studios" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
# Ask before adding a dependency: see CONTRIBUTING.md and docs/design.md section 2.
dependencies = [
    "argon2-cffi>=25.1,<26",
    "django>=6.1.3,<6.2",
    "gunicorn>=26.2,<27",
    "pillow>=13.0,<14",
    "pyotp>=2.10,<3",
    "pypdf>=6.21.4,<7",
    "pypdfium2>=5.14,<6",
    "segno>=1.6.6,<2",
    "whitenoise>=6.12,<7",
]

[project.scripts]
snug = "snug.__main__:main"

[project.urls]
Homepage = "https://github.com/Negroni-Venture-Studios/snug"
Issues = "https://github.com/Negroni-Venture-Studios/snug/issues"
Changelog = "https://github.com/Negroni-Venture-Studios/snug/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "django-stubs>=6.1.2,<6.2",
    "mypy>=2.4",
    "pip-audit>=2.10",
    "pip-licenses>=5.5",
    "playwright>=1.64.1,<2",
    "pre-commit>=4.7",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pytest-django>=4.14,<5",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "S",            # bandit security rules
    "SIM",          # simplifications
    "BLE",          # no blind except
    "RUF",          # ruff's own
    "TID",          # tidy imports and the banned APIs below
    "PTH",          # pathlib over os.path: file paths come from records, never strings glued together
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]  # pytest asserts; test passwords; fixed commands
"**/migrations/*.py" = ["E501", "RUF012"]  # generated by Django
"scripts/**" = ["S603"] # scripts run fixed, trusted commands
"docs/design/**" = ["E501", "S101"]  # design mockup generators: long SVG paths, build-time asserts

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"django.contrib.admin".msg = "Snug does not use the Django admin: it would bypass TOTP. See docs/design.md."
"pickle".msg = "Never unpickle: it runs code. Use JSON."

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["snug", "tests", "scripts"]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
# pypdfium2 ships without type information.
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["snug"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
