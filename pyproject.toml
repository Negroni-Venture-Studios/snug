[project]
name = "snug"
version = "0.0.0"
description = "A self-hosted data room for early-stage founders."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Negroni Venture Studios" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
# Runtime dependencies arrive with step 1 (Django, argon2-cffi, pyotp, segno,
# gunicorn, whitenoise). Ask before adding one: see CONTRIBUTING.md.
dependencies = []

[project.urls]
Homepage = "https://github.com/Negroni-Venture-Studios/snug"
Issues = "https://github.com/Negroni-Venture-Studios/snug/issues"
Changelog = "https://github.com/Negroni-Venture-Studios/snug/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pip-audit>=2.10",
    "pip-licenses>=5.5",
    "pre-commit>=4.7",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "S",            # bandit security rules
    "SIM",          # simplifications
    "BLE",          # no blind except
    "RUF",          # ruff's own
    "TID",          # tidy imports (banned APIs arrive with step 1)
    "PTH",          # pathlib over os.path: file paths come from records, never strings glued together
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is how pytest tests
"scripts/**" = ["S603"] # scripts run fixed, trusted commands
"docs/design/**" = ["E501", "S101"]  # design mockup generators: long SVG paths, build-time asserts

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["snug", "tests", "scripts"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["snug"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
