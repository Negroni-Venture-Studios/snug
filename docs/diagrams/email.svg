<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 664" width="960" height="664" role="img" aria-labelledby="t d">
<title id="t">How Snug sends email</title>
<desc id="d">For each email Snug tries five routes in order and uses the first that applies: Google Workspace connected in Settings, sending through the Gmail API; SMTP saved in Settings; SMTP set in snug.env; the outbox folder, on localhost only; or off. Every SMTP send resolves the server's name, allows only public addresses, connects to the address it checked and verifies TLS for the server's name. Snug sends investors' codes and links, first-open notices and admin emails, and records whether each send worked.</desc>
<defs>
  <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
  <marker id="tip-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow-accent"/></marker>
</defs>
<rect class="bg" width="960" height="664"/>

<!-- The ladder -->
<text class="heading" x="20" y="44">FOR EACH EMAIL, THE FIRST ROUTE THAT APPLIES</text>

<rect class="key" x="20" y="64" width="372" height="60" rx="8"/>
<circle class="solid-action" cx="48" cy="94" r="13"/>
<text class="on-action" x="48" y="99" text-anchor="middle">1</text>
<text class="title" x="74" y="89">Google Workspace</text>
<text class="label" x="74" y="110">connected in Settings, with a refresh token</text>

<rect class="box" x="20" y="148" width="372" height="60" rx="8"/>
<circle class="solid-action" cx="48" cy="178" r="13"/>
<text class="on-action" x="48" y="183" text-anchor="middle">2</text>
<text class="title" x="74" y="173">SMTP saved in Settings</text>
<text class="label" x="74" y="194">server, port, account and From address</text>

<rect class="box" x="20" y="232" width="372" height="60" rx="8"/>
<circle class="solid-action" cx="48" cy="262" r="13"/>
<text class="on-action" x="48" y="267" text-anchor="middle">3</text>
<text class="title" x="74" y="257">SMTP in snug.env</text>
<text class="mono" x="74" y="278">SNUG_SMTP_HOST and the rest</text>

<rect class="box" x="20" y="316" width="372" height="60" rx="8"/>
<circle class="solid-action" cx="48" cy="346" r="13"/>
<text class="on-action" x="48" y="351" text-anchor="middle">4</text>
<text class="title" x="74" y="341">The outbox folder</text>
<text class="label" x="74" y="362">only when the domain is localhost</text>

<rect class="box" x="20" y="400" width="372" height="60" rx="8"/>
<circle class="solid-action" cx="48" cy="430" r="13"/>
<text class="on-action" x="48" y="435" text-anchor="middle">5</text>
<text class="title" x="74" y="425">Off</text>
<text class="label" x="74" y="446">nothing is sent</text>

<!-- Otherwise, down the ladder -->
<path class="line" d="M48,124 V146" marker-end="url(#tip)"/>
<path class="line" d="M48,208 V230" marker-end="url(#tip)"/>
<path class="line" d="M48,292 V314" marker-end="url(#tip)"/>
<path class="line" d="M48,376 V398" marker-end="url(#tip)"/>
<text class="small" x="60" y="140">otherwise</text>
<text class="small" x="60" y="224">otherwise</text>
<text class="small" x="60" y="308">otherwise</text>
<text class="small" x="60" y="392">otherwise</text>

<!-- Where each route goes -->
<rect class="box" x="436" y="64" width="176" height="60" rx="8"/>
<text class="title" x="452" y="89">Gmail API</text>
<text class="label" x="452" y="110">HTTPS, port 443</text>

<rect class="box" x="436" y="148" width="176" height="144" rx="8"/>
<text class="title" x="452" y="216">Your SMTP server</text>
<text class="label" x="452" y="237">STARTTLS or TLS</text>

<rect class="box" x="436" y="316" width="176" height="60" rx="8"/>
<text class="title" x="452" y="341">outbox/</text>
<text class="label" x="452" y="362">files in the data folder</text>

<path class="line-accent" d="M392,94 H436" marker-end="url(#tip-accent)"/>
<path class="line" d="M392,178 H436" marker-end="url(#tip)"/>
<path class="line" d="M392,262 H436" marker-end="url(#tip)"/>
<path class="line" d="M392,346 H436" marker-end="url(#tip)"/>

<!-- Every SMTP send -->
<rect class="zone" x="652" y="64" width="288" height="312" rx="10"/>
<text class="heading" x="668" y="90">EVERY SMTP SEND</text>
<rect class="box" x="668" y="104" width="256" height="44" rx="8"/>
<text class="label" x="684" y="131">Resolve the server's name</text>
<rect class="box" x="668" y="166" width="256" height="44" rx="8"/>
<text class="label" x="684" y="193">Allow only public addresses</text>
<rect class="box" x="668" y="228" width="256" height="44" rx="8"/>
<text class="label" x="684" y="255">Connect to the checked address</text>
<rect class="box" x="668" y="290" width="256" height="44" rx="8"/>
<text class="label" x="684" y="317">Verify TLS for the server's name</text>
<path class="line" d="M796,148 V164" marker-end="url(#tip)"/>
<path class="line" d="M796,210 V226" marker-end="url(#tip)"/>
<path class="line" d="M796,272 V288" marker-end="url(#tip)"/>
<text class="small" x="668" y="358">On localhost, any address is allowed.</text>
<path class="line-dashed" d="M612,220 H652"/>

<!-- What Snug sends -->
<rect class="box" x="20" y="500" width="592" height="140" rx="8"/>
<text class="heading" x="36" y="526">WHAT SNUG SENDS</text>
<text class="label" x="36" y="552">Investors' codes, and the links founders share with them</text>
<text class="label" x="36" y="574">First-open notices to admins</text>
<text class="label" x="36" y="596">Admin invitations, and password and authenticator resets</text>
<text class="label" x="36" y="618">Alerts to every admin when the admins or email settings change</text>

<rect class="zone" x="652" y="500" width="288" height="140" rx="10"/>
<text class="label" x="668" y="550">Snug records whether each send</text>
<text class="label" x="668" y="570">worked, for the Overview and</text>
<text class="mono" x="668" y="592">snug doctor</text>
</svg>
