<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
<title id="t">Snug on one server</title>
<desc id="d">Founders and investors reach Snug through Caddy. Inside the Snug container, gunicorn's web workers serve requests and start a confined document worker for each file. Litestream and the rclone backup container share the data volume and copy it, encrypted, to the founder's bucket. Snug sends email through Google or an SMTP server and fetches country data from DB-IP.</desc>
<defs>
  <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
  <marker id="tip-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow-accent"/></marker>
</defs>
<rect class="bg" width="1000" height="560"/>

<!-- People -->
<text class="heading" x="20" y="66">PEOPLE</text>
<rect class="box" x="20" y="150" width="170" height="64" rx="8"/>
<text class="title" x="36" y="177">Founder</text>
<text class="mono" x="36" y="199">/admin/</text>
<rect class="box" x="20" y="330" width="170" height="64" rx="8"/>
<text class="title" x="36" y="357">Investor</text>
<text class="mono" x="36" y="379">/v/&lt;token&gt;/</text>

<!-- The server -->
<rect class="zone-dashed" x="226" y="40" width="540" height="500" rx="12"/>
<text class="heading" x="246" y="66">YOUR SERVER</text>

<rect class="box" x="246" y="236" width="138" height="72" rx="8"/>
<text class="title" x="262" y="264">Caddy</text>
<text class="label" x="262" y="286">HTTPS and its</text>
<text class="label" x="262" y="302">certificates</text>

<rect class="zone" x="414" y="84" width="332" height="250" rx="10"/>
<text class="heading" x="430" y="108">SNUG CONTAINER</text>
<rect class="box" x="430" y="120" width="300" height="56" rx="8"/>
<text class="title" x="446" y="144">gunicorn master</text>
<text class="label" x="446" y="164">starts the workers; housekeeping hourly</text>
<rect class="box" x="430" y="188" width="300" height="56" rx="8"/>
<text class="title" x="446" y="212">Web workers</text>
<text class="label" x="446" y="232">Django, several threads each</text>
<rect class="key" x="430" y="262" width="300" height="56" rx="8"/>
<text class="title" x="446" y="286">Document worker</text>
<text class="label" x="446" y="306">one per file: Landlock, seccomp, no network</text>

<!-- Data volume, drawn as a cylinder -->
<path class="box" d="M414,386 v92 a82,16 0 0 0 164,0 v-92"/>
<ellipse class="box" cx="496" cy="386" rx="82" ry="16"/>
<text class="title" x="436" y="428">Data volume</text>
<text class="label" x="436" y="448">database, uploads,</text>
<text class="label" x="436" y="464">page cache, replica</text>

<rect class="box" x="606" y="366" width="140" height="64" rx="8"/>
<text class="title" x="622" y="392">Litestream</text>
<text class="label" x="622" y="414">database replica</text>
<rect class="box" x="606" y="452" width="140" height="64" rx="8"/>
<text class="title" x="622" y="478">rclone</text>
<text class="label" x="622" y="500">encrypts, 5 minutes</text>

<!-- Outside -->
<text class="heading" x="806" y="66">OUTSIDE</text>
<rect class="box" x="806" y="116" width="174" height="64" rx="8"/>
<text class="title" x="822" y="142">DB-IP</text>
<text class="label" x="822" y="164">country data, monthly</text>
<rect class="box" x="806" y="184" width="174" height="64" rx="8"/>
<text class="title" x="822" y="210">Email</text>
<text class="label" x="822" y="232">Gmail API or SMTP</text>
<rect class="key" x="806" y="452" width="174" height="64" rx="8"/>
<text class="title" x="822" y="478">Your bucket</text>
<text class="label" x="822" y="500">only you hold the key</text>

<!-- Connections -->
<path class="line-accent" d="M190,182 H216 V258 H246" marker-end="url(#tip-accent)"/>
<path class="line-accent" d="M190,362 H216 V286 H246" marker-end="url(#tip-accent)"/>
<path class="line-accent" d="M384,272 H404 V216 H430" marker-end="url(#tip-accent)"/>
<path class="line" d="M580,244 V262" marker-end="url(#tip)" marker-start="url(#tip)"/>
<path class="line" d="M496,334 V368" marker-start="url(#tip)" marker-end="url(#tip)"/>
<path class="line" d="M578,398 H606" marker-start="url(#tip)" marker-end="url(#tip)"/>
<path class="line" d="M578,484 H606" marker-end="url(#tip)"/>
<path class="line" d="M746,484 H806" marker-end="url(#tip)"/>
<path class="line" d="M730,148 H806" marker-end="url(#tip)"/>
<path class="line" d="M730,216 H806" marker-end="url(#tip)"/>
</svg>
