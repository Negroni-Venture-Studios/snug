<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d">
<title id="t">How a request reaches a view</title>
<desc id="d">A browser's request goes through Caddy, which handles HTTPS and adds X-Forwarded-For, to a gunicorn web worker. There it passes Django's middleware in order: security headers, the health check, static files, sessions, the upload size limit, CSRF, authentication and the admin session limits. The URL router then sends it to the admin views, the viewer views, every one of which goes through authorise(), or the public branding files. What comes back is HTML, page images, video in byte ranges, charts drawn on the server and stamped downloads.</desc>
<defs>
  <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
  <marker id="tip-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow-accent"/></marker>
</defs>
<rect class="bg" width="960" height="640"/>

<!-- Browser and Caddy -->
<rect class="box" x="20" y="101" width="140" height="70" rx="8"/>
<text class="title" x="36" y="128">Browser</text>
<text class="label" x="36" y="150">founder or investor</text>

<rect class="box" x="196" y="101" width="164" height="70" rx="8"/>
<text class="title" x="212" y="128">Caddy</text>
<text class="label" x="212" y="150">HTTPS; adds</text>
<text class="mono" x="212" y="164">X-Forwarded-For</text>

<!-- The web worker and its middleware -->
<rect class="zone" x="374" y="60" width="258" height="560" rx="10"/>
<text class="heading" x="398" y="84">GUNICORN WEB WORKER</text>
<text class="small" x="398" y="104">2 workers, 4 threads each</text>

<rect class="box" x="398" y="118" width="218" height="46" rx="6"/>
<text x="412" y="137">Security headers</text>
<text class="small" x="412" y="155">CSP, HSTS, no framing</text>
<rect class="box" x="398" y="170" width="218" height="46" rx="6"/>
<text x="412" y="189">Health check</text>
<text class="small" x="412" y="207">/healthz answered here</text>
<rect class="box" x="398" y="222" width="218" height="46" rx="6"/>
<text x="412" y="241">WhiteNoise</text>
<text class="small" x="412" y="259">serves /static/</text>
<rect class="box" x="398" y="274" width="218" height="46" rx="6"/>
<text x="412" y="293">Sessions</text>
<text class="small" x="412" y="311">the admin's, in the database</text>
<rect class="box" x="398" y="326" width="218" height="46" rx="6"/>
<text x="412" y="345">Upload size limit</text>
<text class="small" x="412" y="363">413 before the body is read</text>
<rect class="box" x="398" y="378" width="218" height="46" rx="6"/>
<text x="412" y="397">CSRF</text>
<text class="small" x="412" y="415">checks every POST</text>
<rect class="box" x="398" y="430" width="218" height="46" rx="6"/>
<text x="412" y="449">Authentication</text>
<text class="small" x="412" y="467">the admin, if signed in</text>
<rect class="box" x="398" y="482" width="218" height="46" rx="6"/>
<text x="412" y="501">Admin session limits</text>
<text class="small" x="412" y="519">1 hour idle, 12 hours in all</text>

<rect class="key" x="398" y="546" width="218" height="56" rx="8"/>
<text class="title" x="412" y="570">URL router</text>
<text class="mono" x="412" y="590">snug/urls.py</text>

<!-- Views -->
<rect class="box" x="680" y="290" width="260" height="92" rx="8"/>
<text class="title" x="696" y="314">Admin views</text>
<text class="mono" x="696" y="334">/admin/</text>
<text class="small" x="696" y="354">password and authenticator;</text>
<text class="small" x="696" y="370">a fresh code for sensitive changes</text>

<rect class="key" x="680" y="398" width="260" height="76" rx="8"/>
<text class="title" x="696" y="422">Viewer views</text>
<text class="mono" x="696" y="442">/v/&lt;token&gt;/</text>
<text class="small" x="696" y="462">every one through authorise()</text>

<rect class="box" x="680" y="490" width="260" height="76" rx="8"/>
<text class="title" x="696" y="514">Branding</text>
<text class="mono" x="696" y="534">/brand/</text>
<text class="small" x="696" y="554">logo, icon and colours; public</text>

<!-- What comes back -->
<rect class="zone" x="680" y="60" width="260" height="206" rx="10"/>
<text class="heading" x="696" y="84">WHAT COMES BACK</text>
<rect class="solid-action" x="696" y="108" width="8" height="8" rx="2"/>
<text x="714" y="117">HTML pages</text>
<rect class="solid-action" x="696" y="138" width="8" height="8" rx="2"/>
<text x="714" y="147">Page images, as WebP</text>
<rect class="solid-action" x="696" y="168" width="8" height="8" rx="2"/>
<text x="714" y="177">Video, in byte ranges</text>
<rect class="solid-action" x="696" y="198" width="8" height="8" rx="2"/>
<text x="714" y="207">SVG charts, drawn on the server</text>
<rect class="solid-action" x="696" y="228" width="8" height="8" rx="2"/>
<text x="714" y="237">Stamped downloads</text>

<!-- Connections -->
<path class="line-accent" d="M160,136 H196" marker-end="url(#tip-accent)"/>
<path class="line-accent" d="M360,136 H386 V574 H398" marker-end="url(#tip-accent)"/>
<path class="line-accent" d="M616,574 H648 V336 H680" marker-end="url(#tip-accent)"/>
<path class="line-accent" d="M648,436 H680" marker-end="url(#tip-accent)"/>
<path class="line-accent" d="M648,528 H680" marker-end="url(#tip-accent)"/>
<path class="line-dashed" d="M810,290 V268" marker-end="url(#tip)"/>
<path class="line-dashed" d="M810,60 V36 H90 V99" marker-end="url(#tip)"/>
</svg>
