<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d">
<title id="t">Uploading a document</title>
<desc id="d">An upload passes a size limit in middleware, is received by Django, copied and hashed by ingest, given a kind from its first bytes, checked against the document's earlier versions and inspected by the confined worker, then saved as a new version in one transaction and audited. Any of the marked steps can refuse it, with a plain message beside the form.</desc>
<defs>
  <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
  <marker id="tip-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow-accent"/></marker>
</defs>
<rect class="bg" width="960" height="500"/>

<text class="heading" x="20" y="40">RECEIVING THE FILE</text>

<!-- Row 1 -->
<rect class="box" x="20" y="56" width="166" height="118" rx="8"/>
<text class="title" x="34" y="82">Upload form</text>
<text class="label" x="34" y="104">the admin posts the</text>
<text class="label" x="34" y="121">file with the form</text>

<rect class="box" x="210" y="56" width="166" height="118" rx="8"/>
<text class="title" x="224" y="82">Size limit</text>
<text class="label" x="224" y="104">middleware checks</text>
<text class="label" x="224" y="121">the declared length;</text>
<text class="label" x="224" y="138">too big: refused,</text>
<text class="label" x="224" y="155">the body never read</text>

<rect class="box" x="400" y="56" width="166" height="118" rx="8"/>
<text class="title" x="414" y="82">Django receives it</text>
<text class="label" x="414" y="104">in memory, or in</text>
<text class="label" x="414" y="121">tmp/ when it is large</text>

<rect class="box" x="590" y="56" width="166" height="118" rx="8"/>
<circle class="solid-danger" cx="742" cy="70" r="5"/>
<text class="title" x="604" y="82">Ingest copies it</text>
<text class="label" x="604" y="104">to a file in tmp/,</text>
<text class="label" x="604" y="121">hashing it with</text>
<text class="label" x="604" y="138">SHA-256 and holding</text>
<text class="label" x="604" y="155">it to its kind's limit</text>

<rect class="box" x="780" y="56" width="166" height="118" rx="8"/>
<circle class="solid-danger" cx="932" cy="70" r="5"/>
<text class="title" x="794" y="82">First bytes</text>
<text class="mono" x="794" y="104">ftyp<tspan x="846">→ MP4</tspan></text>
<text class="mono" x="794" y="121">PK<tspan x="846">→ workbook</tspan></text>
<text class="mono" x="794" y="138">%PDF-<tspan x="846">→ PDF</tspan></text>
<text class="mono" x="794" y="155">OLE<tspan x="846">→ refused</tspan></text>

<path class="line" d="M186,115 H210" marker-end="url(#tip)"/>
<path class="line" d="M376,115 H400" marker-end="url(#tip)"/>
<path class="line" d="M566,115 H590" marker-end="url(#tip)"/>
<path class="line" d="M756,115 H780" marker-end="url(#tip)"/>
<path class="line" d="M863,174 V196 H127 V222" marker-end="url(#tip)"/>

<text class="heading" x="20" y="216">KEEPING IT</text>

<!-- Row 2 -->
<rect class="box" x="20" y="230" width="214" height="118" rx="8"/>
<circle class="solid-danger" cx="220" cy="244" r="5"/>
<text class="title" x="34" y="256">Same kind</text>
<text class="label" x="34" y="278">as the document's earlier</text>
<text class="label" x="34" y="295">versions: a deck stays</text>
<text class="label" x="34" y="312">a PDF</text>

<rect class="key" x="258" y="230" width="214" height="118" rx="8"/>
<circle class="solid-danger" cx="458" cy="244" r="5"/>
<text class="title" x="272" y="256">Worker inspects it</text>
<text class="label" x="272" y="278">PDF: pages and sizes</text>
<text class="label" x="272" y="295">workbook: sheets, no code</text>
<text class="label" x="272" y="312">video: length, picture</text>
<text class="label" x="272" y="329">size and codecs</text>

<rect class="box" x="496" y="230" width="214" height="118" rx="8"/>
<text class="title" x="510" y="256">One transaction</text>
<text class="label" x="510" y="278">a DocumentVersion row,</text>
<text class="label" x="510" y="295">then a rename into</text>
<text class="mono" x="510" y="313">originals/</text>
<text class="mono" x="510" y="330">&lt;random&gt;.&lt;ext&gt;</text>

<rect class="box" x="734" y="230" width="212" height="118" rx="8"/>
<text class="title" x="748" y="256">Audited</text>
<text class="label" x="748" y="278">the audit log records</text>
<text class="mono" x="748" y="298">document.</text>
<text class="mono" x="748" y="315">version_uploaded</text>

<path class="line" d="M234,289 H258" marker-end="url(#tip)"/>
<path class="line-accent" d="M472,289 H496" marker-end="url(#tip-accent)"/>
<path class="line" d="M710,289 H734" marker-end="url(#tip)"/>

<!-- Refusal -->
<rect class="box" x="20" y="384" width="926" height="96" rx="8"/>
<rect class="solid-danger" x="20" y="384" width="5" height="96" rx="2"/>
<circle class="solid-danger" cx="46" cy="410" r="5"/>
<text class="title danger" x="60" y="415">Refused</text>
<text class="label" x="46" y="440">Any step marked with a dot can refuse the file. Snug shows a plain message beside the form,</text>
<text class="label" x="46" y="458">records</text>
<text class="mono" x="99" y="458">document.upload_refused</text>
<text class="label" x="279" y="458">and deletes the temporary file. A new document is rolled back with it.</text>
</svg>
