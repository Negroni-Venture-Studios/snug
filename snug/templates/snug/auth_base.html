{% extends "snug/base.html" %}
{% load snug %}
{% block body %}
<div class="screen auth">
<div class="chrome"></div>
<header class="auth-head">
  <div class="product"><span class="brand">{% logo_tile "a" %}<span class="name">Snug</span></span></div>
  {% include "snug/partials/theme_toggle.html" %}
</header>
<main class="auth-main">
  <div class="auth-card">
{% block card %}{% endblock %}
  </div>
</main>
<footer class="admin-foot"><div class="rule"></div><div class="row"><span>Snug, from <a href="https://negroniventurestudios.com/">Negroni Venture Studios</a></span><a class="source-link" href="https://github.com/Negroni-Venture-Studios/snug">{% icon "github-mark" "github-mark" %}Negroni-Venture-Studios/snug</a></div></footer>
</div>
{% endblock %}
