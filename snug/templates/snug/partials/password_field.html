{% load snug %}<div class="password-field"><input id="{{ id }}" name="{{ name|default:id }}" type="password" autocomplete="{{ autocomplete }}" autocapitalize="none" autocorrect="off" spellcheck="false"{% if minlength %} minlength="{{ minlength }}"{% endif %} required{% if autofocus %} autofocus{% endif %}{% if invalid %} aria-invalid="true" aria-describedby="{{ id }}-error"{% endif %}><button class="reveal" type="button" aria-controls="{{ id }}" aria-pressed="false" aria-label="Show password" title="Show password" hidden>{% icon "eye" "when-hidden" %}{% icon "eye-slash" "when-shown" %}</button></div>
