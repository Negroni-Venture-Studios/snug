{% load static %}<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Snug{% endblock %}</title>
<script src="{% static 'snug/js/theme-init.js' %}"></script>
{% if brand_logo %}<link rel="icon" href="{{ brand_logo }}" type="image/png">{% else %}<link rel="icon" href="{% static 'snug/img/favicon.svg' %}" type="image/svg+xml">{% endif %}
<link rel="preload" href="{% static 'snug/fonts/Geist-Variable.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{% static 'snug/css/snug.css' %}">
{% if brand_css %}<link rel="stylesheet" href="{{ brand_css }}">{% endif %}
<script src="{% static 'snug/js/theme.js' %}" defer></script>
{% block scripts %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
