{% extends "snug/auth_base.html" %}
{% block title %}Check your email{% endblock %}
{% block card %}
<h1>Check your email</h1>
<p class="lede">If {{ email }} belongs to an admin, we have sent it a link to choose a new password. The link works for one hour.</p>
<p class="alt"><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
{% endblock %}
