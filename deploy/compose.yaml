# Snug behind Caddy, run with Docker Compose from the folder holding this file
# (/opt/snug on a server set up by cloud-init). Snug's settings are in
# snug.env beside it; .env is a link to snug.env, so Compose can give Caddy
# the domain without giving it the secret key. See docs/deploy.md.

name: snug

x-logging: &logging
  # Docker keeps container output forever by default; a small server fills up.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  snug:
    image: ${SNUG_IMAGE:-ghcr.io/negroni-venture-studios/snug:edge}
    restart: unless-stopped
    env_file: snug.env
    environment:
      # Caddy's fixed addresses on the network below, and nothing else, are
      # believed about the client's address.
      SNUG_TRUSTED_PROXIES: 172.30.83.2/32, fd53:6e75:6700::2/128
    volumes:
      - snug-data:/var/lib/snug
    networks:
      - web
    # Snug writes only to its data folder and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  caddy:
    # 2.11.9 is a security release, taken under the exception in AGENTS.md.
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: unless-stopped
    environment:
      SNUG_DOMAIN: ${SNUG_DOMAIN:?Set SNUG_DOMAIN in snug.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      web:
        ipv4_address: 172.30.83.2
        ipv6_address: fd53:6e75:6700::2
    depends_on:
      - snug
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  web:
    # With IPv6 on, Docker forwards IPv6 visitors to Caddy with their own
    # address. Without it, they all arrive from one proxy address and share
    # one set of rate limits.
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.83.0/24
          gateway: 172.30.83.1
          # Other containers get addresses from the upper half, so Caddy's
          # fixed address is never handed to one that starts first.
          ip_range: 172.30.83.128/25
        - subnet: fd53:6e75:6700::/64
          gateway: fd53:6e75:6700::1
          ip_range: fd53:6e75:6700::1:0/112

volumes:
  snug-data:
  caddy-data:
  caddy-config:
